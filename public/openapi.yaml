openapi: 3.0.3
info:
  title: Telnet Company Assets API
  version: "1.0.0"
  description: |
    Backend API for the Telnet Asset Manager, converted from the Postman collections.
    Authenticate with `POST /api/get-token/`, then send `Authorization: Token <token>` on every request.
    Endpoints marked "used by the app" are called by the frontend but were not shown in the Postman text; confirm with the backend team.
servers:
  - url: http://207.180.246.69:8038
    description: Main API server
  - url: http://207.180.246.69:7038
    description: Token server (get-token, per the Authentication collection)
tags:
  - name: Authentication
  - name: Assets
  - name: Vehicles
  - name: Equipment
  - name: Equipment Maintenance
  - name: Equipment Work Orders
  - name: Documents
  - name: Staff
  - name: Notifications
  - name: Reports
  - name: Settings
  - name: Admin
security:
  - tokenAuth: []
components:
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Format: `Token <your-token>`'
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, example: 10 }
  responses:
    Unauthorized:
      description: Missing or invalid token
  schemas:
    Token:
      type: object
      properties:
        token: { type: string }
    Me:
      type: object
      properties:
        username: { type: string, example: telnet }
        role: { type: string, example: admin }
    Asset:
      type: object
      properties:
        id: { type: integer, example: 180 }
        name: { type: string }
        asset_type: { type: string, example: equipment }
        status: { type: string, example: active }
        assigned_staff: { type: integer, nullable: true }
    Vehicle:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: Toyota Corolla }
        license_plate: { type: string }
        vin_number: { type: string }
        make: { type: string }
        model: { type: string }
        asset_type: { type: string, example: car }
        status: { type: string, enum: [active, pending_certification, damaged, inactive] }
        asset: { type: integer, readOnly: true }
    Equipment:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        equipment_type: { type: string, example: laptop }
        serial_number: { type: string }
        description: { type: string }
        purchase_date: { type: string, format: date }
        warranty_expiry: { type: string, format: date }
        status: { type: string }
        location: { type: string }
        regional_office: { type: string }
        subsidiary: { type: string }
        quantity: { type: integer }
        asset: { type: integer, readOnly: true }
    Maintenance:
      type: object
      properties:
        id: { type: integer }
        equipment: { type: integer }
        description: { type: string }
        maintenance_date: { type: string, format: date }
        due_date: { type: string, format: date }
        cost: { type: string, example: "150.00" }
        notes: { type: string }
    WorkOrder:
      type: object
      properties:
        id: { type: integer }
        equipment: { type: integer }
        equipment_name: { type: string }
        work_type: { type: string, example: repair }
        status: { type: string, example: open }
        priority: { type: string, example: high }
        due_date: { type: string, format: date }
        notes: { type: string }
    Document:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        document_type: { type: string, example: compliance }
        description: { type: string }
        issuing_authority: { type: string }
        issue_date: { type: string, format: date }
        expiry_date: { type: string, format: date }
        status: { type: string, example: active }
        document_number: { type: string }
        notify_days_before: { type: integer }
        location: { type: string }
        document_file: { type: string, example: /media/company_documents/document-upload.pdf }
    Staff:
      type: object
      properties:
        id: { type: integer }
        staff_id: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, nullable: true }
        department: { type: string, nullable: true }
        branch: { type: string, nullable: true }
        driver_status: { type: string, example: available }
        is_active: { type: boolean }
    NotificationSchedule:
      type: object
      properties:
        id: { type: integer }
        schedule_time: { type: string, example: "10:00:00" }
        alert_days: { type: integer, example: 15 }
        is_enabled: { type: boolean }
        last_sent: { type: string, nullable: true, format: date-time }
        updated_at: { type: string, format: date-time }
    NotificationRecipient:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        full_name: { type: string }
        is_active: { type: boolean }
    AdminUser:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string }
        is_active: { type: boolean }
        is_superuser: { type: boolean }
        role: { type: string, enum: [admin, manager, driver, staff] }
        department: { type: string, nullable: true }
    Role:
      type: object
      properties:
        value: { type: string, example: admin }
        label: { type: string, example: Administrator }
    ReportList:
      type: object
      properties:
        count: { type: integer }
        results: { type: array, items: { type: object } }
paths:
  /api/get-token/:
    post:
      tags: [Authentication]
      summary: Get auth token
      security: []
      servers:
        - url: http://207.180.246.69:7038
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Token returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Token" }
  /api/:
    get:
      tags: [Authentication]
      summary: API root (entry points)
      security: []
      responses:
        "200": { description: Links to the main resources }
  /api/me/:
    get:
      tags: [Authentication]
      summary: Current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/asset/{id}/:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Assets]
      summary: Get asset by ID
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
    put:
      tags: [Assets]
      summary: Update asset
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Asset" }
      responses:
        "200": { description: Updated }
    delete:
      tags: [Assets]
      summary: Delete asset
      responses:
        "204": { description: Deleted }
  /api/asset/{id}/assign/:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Assets]
      summary: Assign asset to staff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [staff_id]
              properties:
                staff_id: { type: integer, example: 1 }
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              example: { detail: Asset assigned successfully, asset: { id: 3, assigned_staff: 2 } }
  /api/asset/{id}/release/:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Assets]
      summary: Release asset assignment
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Released
          content:
            application/json:
              example: { detail: Asset assignment released successfully, asset: { id: 3, assigned_staff: null } }
  /api/asset/{id}/history/:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Assets]
      summary: Asset assignment history
      responses:
        "200":
          description: History entries
          content:
            application/json:
              schema: { type: array, items: { type: object } }
  /api/vehicles/:
    get:
      tags: [Vehicles]
      summary: List vehicles
      responses:
        "200":
          description: Vehicles
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Vehicle" } }
    post:
      tags: [Vehicles]
      summary: Create vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Vehicle" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }
  /api/vehicles/{id}/:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      tags: [Vehicles]
      summary: Update vehicle
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Vehicle" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }
    delete:
      tags: [Vehicles]
      summary: Delete vehicle
      responses:
        "204": { description: Deleted }
  /api/equipment/:
    get:
      tags: [Equipment]
      summary: List equipment
      responses:
        "200":
          description: Equipment
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Equipment" } }
    post:
      tags: [Equipment]
      summary: Create equipment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Equipment" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Equipment" }
  /api/equipment/{id}/:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      tags: [Equipment]
      summary: Update equipment
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Equipment" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Equipment" }
    delete:
      tags: [Equipment]
      summary: Delete equipment
      responses:
        "204": { description: Deleted }
  /api/equipment-maintenance/:
    get:
      tags: [Equipment Maintenance]
      summary: List maintenance records
      responses:
        "200":
          description: Records
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Maintenance" } }
    post:
      tags: [Equipment Maintenance]
      summary: Create maintenance record
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Maintenance" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Maintenance" }
  /api/equipment-maintenance/{id}/:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Equipment Maintenance]
      summary: Get maintenance record
      responses:
        "200":
          description: Record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Maintenance" }
    put:
      tags: [Equipment Maintenance]
      summary: Update maintenance record
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Maintenance" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Maintenance" }
    delete:
      tags: [Equipment Maintenance]
      summary: Delete maintenance record (used by the app)
      responses:
        "204": { description: Deleted }
  /api/equipment-work-orders/:
    get:
      tags: [Equipment Work Orders]
      summary: List equipment work orders
      description: Automatically generated repair and certification work orders.
      responses:
        "200":
          description: Work orders
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/WorkOrder" } }
  /api/documents/:
    get:
      tags: [Documents]
      summary: List documents
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Document" } }
    post:
      tags: [Documents]
      summary: Create or upload document
      description: Send JSON for metadata only, or multipart/form-data to include `document_file`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Document" }
          multipart/form-data:
            schema:
              allOf:
                - $ref: "#/components/schemas/Document"
                - type: object
                  properties:
                    document_file: { type: string, format: binary }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
  /api/documents/{id}/:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Documents]
      summary: Get document
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
    put:
      tags: [Documents]
      summary: Update document
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Document" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
    patch:
      tags: [Documents]
      summary: Partially update document (supports file upload)
      requestBody:
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: "#/components/schemas/Document"
                - type: object
                  properties:
                    document_file: { type: string, format: binary }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
    delete:
      tags: [Documents]
      summary: Delete document (used by the app)
      responses:
        "204": { description: Deleted }
  /api/staff/:
    get:
      tags: [Staff]
      summary: List staff
      responses:
        "200":
          description: Staff
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Staff" } }
    post:
      tags: [Staff]
      summary: Create staff
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Staff" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Staff" }
  /api/staff/{id}/:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      tags: [Staff]
      summary: Update staff
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Staff" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Staff" }
    delete:
      tags: [Staff]
      summary: Delete staff (used by the app)
      responses:
        "204": { description: Deleted }
  /api/v1/notifications/schedule/:
    get:
      tags: [Notifications]
      summary: Get notification schedule
      responses:
        "200":
          description: Schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSchedule" }
    patch:
      tags: [Notifications]
      summary: Update notification schedule
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                is_enabled: { type: boolean }
                alert_days: { type: integer }
                schedule_time: { type: string, example: "10:00:00" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSchedule" }
  /api/v1/notifications/recipients/:
    get:
      tags: [Notifications]
      summary: List notification recipients
      responses:
        "200":
          description: Recipients
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  results: { type: array, items: { $ref: "#/components/schemas/NotificationRecipient" } }
    post:
      tags: [Notifications]
      summary: Add notification recipient (used by the app)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationRecipient" }
      responses:
        "201": { description: Created }
  /api/v1/notifications/deliveries/:
    get:
      tags: [Notifications]
      summary: List deliveries (used by the app)
      responses:
        "200": { description: Deliveries }
  /api/v1/notifications/send-now/:
    post:
      tags: [Notifications]
      summary: Send notifications now (used by the app)
      responses:
        "200": { description: Triggered }
  /api/v1/notifications/deliveries/{id}/retry/:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Notifications]
      summary: Retry a delivery (used by the app)
      responses:
        "200": { description: Retried }
  /api/v1/reports/overview/:
    get:
      tags: [Reports]
      summary: Overview report
      responses:
        "200":
          description: Overview
          content:
            application/json:
              example:
                generated_at: "2026-09-07T07:54:40Z"
                assets: { total: 359, active: 336, unassigned: 20 }
                vehicles: 15
                equipment: 6
                documents: { total: 27, expired: 3, expiring: 3 }
                maintenance: { vehicle_cost: 260000, equipment_cost: 128100 }
  /api/v1/reports/vehicles/:
    get:
      tags: [Reports]
      summary: Vehicles report
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportList" }
  /api/v1/reports/equipment/:
    get:
      tags: [Reports]
      summary: Equipment report
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportList" }
  /api/v1/reports/documents/:
    get:
      tags: [Reports]
      summary: Documents report
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportList" }
  /api/v1/reports/maintenance/:
    get:
      tags: [Reports]
      summary: Maintenance report
      responses:
        "200":
          description: Report
          content:
            application/json:
              example:
                summary: { vehicle_count: 3, equipment_count: 4, vehicle_cost: 260000, equipment_cost: 128100 }
                vehicles: []
                equipment: []
  /api/v1/reports/transfers/:
    get:
      tags: [Reports]
      summary: Transfers report (used by the app)
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportList" }
  /api/v1/reports/audit/:
    get:
      tags: [Reports]
      summary: Audit log report (used by the app)
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportList" }
  /api/v1/settings/organization/:
    get:
      tags: [Settings]
      summary: Get organization settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              example: { name: Telnet Asset Management, timezone: Africa/Lagos, file_upload_max_size_mb: 10 }
  /api/v1/settings/notifications/:
    get:
      tags: [Settings]
      summary: Get notification settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSchedule" }
    patch:
      tags: [Settings]
      summary: Update notification settings
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                is_enabled: { type: boolean }
                alert_days: { type: integer }
                schedule_time: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSchedule" }
  /api/v1/settings/profile/:
    get:
      tags: [Settings]
      summary: Get own profile (used by the app)
      responses:
        "200": { description: Profile }
    patch:
      tags: [Settings]
      summary: Update own profile (used by the app)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string }
      responses:
        "200": { description: Updated }
  /api/v1/admin/users/:
    get:
      tags: [Admin]
      summary: List users (read-only)
      parameters: [{ $ref: "#/components/parameters/PageSize" }]
      responses:
        "200":
          description: Paginated users
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  results: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
  /api/v1/admin/roles/:
    get:
      tags: [Admin]
      summary: List roles
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Role" } }
  /api/v1/admin/staff/:
    get:
      tags: [Admin]
      summary: Admin staff directory
      parameters: [{ $ref: "#/components/parameters/PageSize" }]
      responses:
        "200":
          description: Paginated staff
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  results: { type: array, items: { $ref: "#/components/schemas/Staff" } }
